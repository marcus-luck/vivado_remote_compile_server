# The build server: Caddy (HTTPS), the API server and the build worker.
#
#   docker compose up -d --build
#
# Needs .env (from .env.template) and deploy/caddy.env (from
# deploy/caddy.env.template) next to this file, and the Linux Vivado install
# on the host at /opt/Xilinx, or at VIVADO_DIR set in .env. See "Deployment"
# in README.md.

name: buildserver

services:
  caddy:
    build: deploy/caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: deploy/caddy.env
    environment:
      # The site address in the Caddyfile; compose reads it from .env.
      BUILDSERVER_PUBLIC_URL: ${BUILDSERVER_PUBLIC_URL:?set BUILDSERVER_PUBLIC_URL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      BUILDSERVER_DATA_DIR: /data
    volumes:
      - data:/data
    security_opt:
      - no-new-privileges:true
    # deploy/buildserverctl uses healthz to check if a deploy is succesful.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 2s
      retries: 3

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      BUILDSERVER_DATA_DIR: /data
      BUILDSERVER_WORK_DIR: /work
      BUILDSERVER_BUILD_USER: builder
    volumes:
      - data:/data
      - work:/work
      - ${VIVADO_DIR:-/opt/Xilinx}:/opt/Xilinx:ro
    # If a workers restarts a running build fails, need time to be destroyed.
    stop_grace_period: 30s
    init: true
    # Uncomment to cap what a build can take:
    # mem_limit: 48g
    # cpus: 12

volumes:
  data:
  work:
  caddy_data:
  caddy_config:
